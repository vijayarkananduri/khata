name: Signed Android Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  signed-release:
    name: Test, sign and publish APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check signing secrets are configured
        shell: bash
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository Actions secret: ${name}"
              exit 1
            fi
          done
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Decode owner keystore outside the repository
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/khata-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          echo "KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          chmod 600 "$key_path"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble signed release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify APK signature
        shell: bash
        run: |
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer"
          "$signer" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Publish signed APK on the tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
            --title "Khata $GITHUB_REF_NAME" \
            --generate-notes
