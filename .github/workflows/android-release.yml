name: Android Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    name: Test, build, and publish Khata APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Detect owner signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Owner signing secrets are not all configured; publishing a debug-signed test prerelease."
          fi
      - name: Decode owner keystore outside the repository
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/khata-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          echo "KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
          chmod 600 "$key_path"
      - name: Guard against Haze renderer regressions
        shell: bash
        run: |
          if grep -R -n -i -E 'haze(source|effect|child|state)|rememberhazestate|chrisbanes\.haze' app/src/main/java app/build.gradle.kts; then
            echo "Haze APIs are disabled in 2.0.0 because they caused a confirmed renderer crash."
            exit 1
          fi
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble owner-signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify owner-signed APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer"
          "$signer" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Khata-$GITHUB_REF_NAME.apk"
      - name: Assemble debug test APK
        if: steps.signing.outputs.enabled != 'true'
        run: ./gradlew assembleDebug --stacktrace
      - name: Prepare debug test prerelease APK
        if: steps.signing.outputs.enabled != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Khata-$GITHUB_REF_NAME-debug-test.apk"
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khata-${{ github.ref_name }}
          path: ${{ runner.temp }}/Khata-${{ github.ref_name }}*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Create release notes
        shell: bash
        run: |
          {
            echo "## Khata $GITHUB_REF_NAME"
            echo
            if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
              echo "Owner-key-signed Android APK."
            else
              echo "Debug-signed APK for device testing; this is not a Play Store production-signed build."
            fi
            echo
            echo "### Highlights"
            echo "- Removed the Haze runtime and dependency entirely after reproducing a source/child rendering crash; surfaces retain safe static glass-inspired gradients."
            echo "- Onboarding now inherits a theme-aware high-contrast foreground in light and dark modes."
            echo "- Includes daily/weekly/monthly/all-time widgets, quote rotation, optional notifications, and local-first records."
            echo "- See the repository README for the concise feature list."
          } > "$RUNNER_TEMP/release-notes.md"
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
            asset="$RUNNER_TEMP/Khata-$GITHUB_REF_NAME.apk"
            prerelease_flag=()
          else
            asset="$RUNNER_TEMP/Khata-$GITHUB_REF_NAME-debug-test.apk"
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Khata $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "Khata $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${prerelease_flag[@]}"
          fi
